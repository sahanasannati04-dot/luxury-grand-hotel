{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container mt-5 auth-page login-card">

<div class="row justify-content-center">

<div class="col-12">

<div class="card shadow auth-card">

<div class="card-body">

<h2 class="text-center mb-4">

Login

</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control">

</div>

<button class="btn btn-success w-100">

Login

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
